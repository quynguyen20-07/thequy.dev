<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- main smooth ring (search-like, not letter) -->
  <path d="
    M32 16
    A16 16 0 1 1 31.9 16
  " fill="none" stroke="url(#stroke)" stroke-width="5" stroke-linecap="round"/>

  <!-- smooth tail (curved instead of straight line) -->
  <path d="
    M40 40
    C44 44, 47 47, 50 50
  " fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- soft highlight dot -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" opacity="0.85"/>
</svg>